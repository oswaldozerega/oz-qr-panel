<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OZ QR Code Generator</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; background: #EDF3F6; color: #15212A; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  main { background: rgba(255,255,255,.8); padding: 28px 32px; border-radius: 18px; box-shadow: 0 12px 32px rgba(32,66,86,.12); max-width: 420px; }
  code { font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Prueba de conexión</h1>
  <p id="estado">Esperando a la página de Wix…</p>
  <p><code id="detalle"></code></p>
</main>
<script>
/* Puente panel ↔ página de Wix: el panel no habla con el servidor; la página privada
   de Wix (con sesión de administrador) llama a backend/panel.web.js y devuelve la respuesta. */
const pendientes = new Map();
let siguiente = 1;
function llamar(metodo, ...args) {
  const id = siguiente++;
  return new Promise((resolve, reject) => {
    pendientes.set(id, { resolve, reject });
    window.parent.postMessage({ oz: 'llamada', id, metodo, args }, '*');
    setTimeout(() => { if (pendientes.delete(id)) reject(new Error('La página de Wix no respondió.')); }, 20000);
  });
}
window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.oz !== 'respuesta' || !pendientes.has(m.id)) return;
  const p = pendientes.get(m.id); pendientes.delete(m.id);
  m.ok ? p.resolve(m.data) : p.reject(new Error(m.error));
});
(async () => {
  try {
    const datos = await llamar('cargarTodo');
    document.getElementById('estado').textContent = `Conectado. Códigos: ${datos.codigos.length} · Empresas: ${datos.empresas.length} · Tarjetas: ${datos.tarjetas.length}`;
    const totales = await llamar('totalesDeEscaneos');
    document.getElementById('detalle').textContent = JSON.stringify(totales);
  } catch (err) {
    document.getElementById('estado').textContent = `Sin conexión: ${err.message}`;
  }
})();
</script>
</body>
</html>
